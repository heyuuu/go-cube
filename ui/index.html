<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cube</title>
  <link rel="stylesheet" href="/ui/app.css">
  <!-- 顺序：app.js 必须在 alpine 之前加载，确保 Alpine 初始化 x-data="cubeApp()" 时 window.cubeApp 已定义 -->
  <script defer src="/ui/app.js"></script>
  <script defer src="/ui/vendor/alpine.min.js"></script>
</head>
<body>
<div class="layout" x-data="cubeApp()">

  <!-- ============ 左侧栏 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">▣</span> cube
    </div>

    <!-- domain switcher（当前仅 project） -->
    <div class="switcher">
      <span class="switcher-current">project</span>
      <span class="switcher-arrow">▾</span>
    </div>

    <!-- project 域导航 -->
    <nav class="nav">
      <a class="nav-item" :class="{ 'active': view === 'projects' }"
         @click="view = 'projects'">Projects</a>
      <a class="nav-item" :class="{ 'active': view === 'tree' }"
         @click="switchView('tree')">Tree</a>
    </nav>

    <div class="sidebar-foot">
      <a href="/docs" target="_blank" class="foot-link">API Docs ↗</a>
    </div>
  </aside>

  <!-- ============ 右侧正文 ============ -->
  <main class="content">

    <!-- ============ Projects 视图 ============ -->
    <div x-show="view === 'projects'">

    <!-- 页内标题区 -->
    <header class="page-head">
      <div>
        <div class="page-title">Projects</div>
        <div class="page-meta">
          git 缓存更新：<span class="meta-time" x-text="gitCacheUpdatedText"></span>
          <span class="meta-tip" x-show="gitCacheUpdated" :title="formatTime(gitCacheUpdated)">ⓘ</span>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost" @click="refresh()" :disabled="loading">
          <span x-show="!loading">刷新</span>
          <span x-show="loading">刷新中…</span>
        </button>
      </div>
    </header>

    <!-- 工具条：搜索 + 筛选 -->
    <div class="toolbar">
      <input class="input" type="text" x-model="keyword" placeholder="🔍 搜索项目名 / 路径">
      <span class="count">共 <strong x-text="filtered.length"></strong> 个</span>
    </div>

    <!-- group 筛选（inline chips，一行展示，直接点击切换） -->
    <div class="chip-row">
      <span class="chip-label">group <span class="chip-mode">多选</span></span>
      <button class="chip" :class="{ 'chip-active': groupFilter.length === 0 }"
              @click="groupFilter = []">全部</button>
      <template x-for="g in groups" :key="g">
        <button class="chip" :class="{ 'chip-active': groupFilter.includes(g) }"
                @click="toggleChip('groupFilter', g)" x-text="g"></button>
      </template>
    </div>

    <!-- git 状态筛选（inline chips） -->
    <div class="chip-row">
      <span class="chip-label">git <span class="chip-mode">单选</span></span>
      <button class="chip" :class="{ 'chip-active': gitFilter === 'all' }"
              @click="gitFilter = 'all'">全部</button>
      <template x-for="s in gitStatuses" :key="s.value">
        <button class="chip" :class="{ 'chip-active': gitFilter === s.value }"
                @click="gitFilter = s.value" x-text="s.label"></button>
      </template>
    </div>

    <!-- tag 筛选（inline chips，单选） -->
    <div class="chip-row">
      <span class="chip-label">tag <span class="chip-mode">单选</span></span>
      <button class="chip" :class="{ 'chip-active': tagFilter === 'all' }"
              @click="tagFilter = 'all'">全部</button>
      <template x-for="t in tags" :key="t">
        <button class="chip" :class="{ 'chip-active': tagFilter === t }"
                @click="tagFilter = t" x-text="t"></button>
      </template>
    </div>

    <!-- 批量动作条（占位，待后端批量 API） -->
    <div class="batch-bar" x-show="selected.size > 0" x-transition>
      已选 <strong x-text="selected.size"></strong> 个 ——
      <button class="btn btn-ghost" disabled title="待后端 pull API">Pull</button>
      <button class="btn btn-ghost" disabled title="待后端 open API">Open ▾</button>
      <button class="btn btn-link" @click="selected.clear()">取消</button>
    </div>

    <!-- 错误提示 -->
    <div class="error-banner" x-show="error" x-transition x-text="error"></div>

    <!-- 表格 -->
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th class="col-check"></th>
            <th class="col-name">name</th>
            <th class="col-group">group</th>
            <th class="col-git">git</th>
            <th class="col-tags">tags</th>
            <th class="col-action"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="p in filtered" :key="p.path">
            <tr @click="openDrawer(p)" :class="{ 'row-selected': selected.has(p.path) }">
              <td class="col-check" @click.stop>
                <input type="checkbox"
                       :checked="selected.has(p.path)"
                       @change="toggleSelect(p.path)">
              </td>
              <td class="col-name">
                <div class="name-main" x-text="p.name"></div>
                <div class="name-path" x-text="p.path"></div>
              </td>
              <td class="col-group"><span class="badge badge-blue" x-text="p.group"></span></td>
              <td class="col-git">
                <template x-if="p.gitInfo === null">
                  <span class="badge badge-mute">未采集</span>
                </template>
                <template x-if="p.gitInfo">
                  <div class="git-cell">
                    <span class="git-branch" x-text="'⎇ ' + (p.gitInfo.currentBranch || p.gitInfo.defaultBranch || '-')"></span>
                    <span class="badge badge-red" x-show="p.gitInfo.dirty">dirty</span>
                    <span class="badge badge-yellow" x-show="p.gitInfo.ahead > 0" x-text="'↑' + p.gitInfo.ahead"></span>
                    <span class="badge badge-mute" x-show="p.gitInfo.behind > 0" x-text="'↓' + p.gitInfo.behind"></span>
                    <span class="badge badge-green" x-show="!p.gitInfo.dirty && p.gitInfo.ahead === 0 && p.gitInfo.behind === 0">clean</span>
                  </div>
                </template>
              </td>
              <td class="col-tags">
                <template x-for="t in p.tags" :key="t">
                  <span class="tag" :class="{ 'tag-worktree': t === 'git-worktree' }" x-text="t"></span>
                </template>
              </td>
              <td class="col-action" @click.stop>
                <div class="open-menu" @click.away="openMenuPath = null">
                  <button class="row-more" @click="toggleOpenMenu(p.path)" title="用 app 打开">▾</button>
                  <div class="ms-panel open-panel" x-show="openMenuPath === p.path" x-transition.origin.top.right>
                    <div class="ms-panel-title">打开方式</div>
                    <template x-for="op in openers" :key="op.name">
                      <button class="ms-option ms-option-btn"
                              @click="openProject(p.path, op.name)"
                              :disabled="opening[p.path + op.name]">
                        <span x-text="op.name"></span>
                      </button>
                    </template>
                    <div class="ms-panel-empty" x-show="openers.length === 0">未配置 opener</div>
                  </div>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>

      <!-- 空状态 -->
      <div class="empty" x-show="!loading && filtered.length === 0 && !error">
        <div class="empty-title">无匹配项目</div>
        <div class="empty-sub" x-show="projects.length === 0">尚未扫描到任何项目，检查 scan 配置。</div>
        <div class="empty-sub" x-show="projects.length > 0">试试调整搜索或筛选条件。</div>
      </div>

      <!-- 加载态 -->
      <div class="empty" x-show="loading && projects.length === 0">
        <div class="empty-title">加载中…</div>
      </div>
    </div>

    </div><!-- /Projects 视图 -->

    <!-- ============ Tree 视图 ============ -->
    <div x-show="view === 'tree'" x-transition>
      <header class="page-head">
        <div>
          <div class="page-title">Tree</div>
          <div class="page-meta">项目目录树（点击节点展开/折叠）</div>
        </div>
        <div class="page-actions">
          <button class="btn btn-ghost" @click="loadTree()" :disabled="treeLoading">
            <span x-show="!treeLoading">刷新</span>
            <span x-show="treeLoading">加载中…</span>
          </button>
          <button class="btn btn-ghost" @click="expandAllTree()">全展开</button>
          <button class="btn btn-ghost" @click="collapseAllTree()">全折叠</button>
        </div>
      </header>
      <div class="error-banner" x-show="treeError" x-transition x-text="treeError"></div>
      <div class="tree-view" x-show="treeRoot && !treeError">
        <!-- 扁平化渲染：树拍平成行，每行带 depth + expanded，点击展开/折叠 -->
        <template x-for="row in flatTree" :key="row.path">
          <div class="tree-row"
               :style="'padding-left: ' + (row.depth * 20 + 12) + 'px'"
               @click="toggleTreeNode(row)">
            <!-- 展开/折叠箭头：含子节点显示 ▾/▸，叶子显示空心圆 -->
            <span class="tree-arrow" x-show="row.hasChildren" x-text="row.expanded ? '▾' : '▸'"></span>
            <span class="tree-arrow tree-arrow-leaf" x-show="!row.hasChildren">·</span>
            <span class="tree-label" :class="'tree-label-' + row.kind" x-text="row.name"></span>
            <!-- 项目节点：可打开 -->
            <span class="tree-actions" x-show="row.kind === 'project'" @click.stop>
              <button class="tree-open-btn" @click="openProject(row.path, 'finder')">Finder</button>
            </span>
          </div>
        </template>
      </div>
    </div><!-- /Tree 视图 -->

    <!-- ============ 详情抽屉（点行滑出） ============ -->
    <div class="drawer-mask" x-show="drawer" x-transition.opacity @click="drawer = null"></div>
    <aside class="drawer" x-show="drawer" x-transition.origin.right>
      <template x-if="drawer">
        <div class="drawer-body">
          <div class="drawer-head">
            <div>
              <div class="drawer-title" x-text="drawer.name"></div>
              <div class="drawer-sub" x-text="drawer.path"></div>
            </div>
            <button class="btn btn-link" @click="drawer = null">✕</button>
          </div>

          <section class="drawer-section">
            <div class="drawer-label">基本信息</div>
            <dl class="kv">
              <dt>group</dt><dd x-text="drawer.group"></dd>
              <dt>repo</dt><dd x-text="drawer.repoUrl || '-'"></dd>
              <dt>tags</dt>
              <dd>
                <template x-for="t in drawer.tags" :key="t">
                  <span class="tag" x-text="t"></span>
                </template>
                <span x-show="drawer.tags.length === 0">-</span>
              </dd>
            </dl>
          </section>

          <section class="drawer-section" x-show="drawer.gitInfo">
            <div class="drawer-label">git 状态</div>
            <dl class="kv">
              <dt>branch</dt><dd x-text="drawer.gitInfo?.currentBranch || '-'"></dd>
              <dt>default</dt><dd x-text="drawer.gitInfo?.defaultBranch || '-'"></dd>
              <dt>ahead/behind</dt>
              <dd>
                <span x-text="'↑' + (drawer.gitInfo?.ahead || 0)"></span> /
                <span x-text="'↓' + (drawer.gitInfo?.behind || 0)"></span>
              </dd>
              <dt>dirty</dt>
              <dd>
                <span class="badge badge-red" x-show="drawer.gitInfo?.dirty">dirty</span>
                <span class="badge badge-green" x-show="!drawer.gitInfo?.dirty">clean</span>
              </dd>
              <template x-if="drawer.gitInfo?.worktreeMain">
                <dt>worktree 主库</dt>
              </template>
              <template x-if="drawer.gitInfo?.worktreeMain">
                <dd><code x-text="drawer.gitInfo?.worktreeMain"></code></dd>
              </template>
              <dt>采集时间</dt><dd x-text="formatTime(drawer.gitInfo?.collectedAt)"></dd>
            </dl>
          </section>

          <section class="drawer-section">
            <div class="drawer-label">动作</div>
            <div class="drawer-actions">
              <div class="open-menu drawer-open-menu" @click.away="drawerOpenMenu = false">
                <button class="btn" @click="drawerOpenMenu = !drawerOpenMenu">
                  打开方式 ▾
                </button>
                <div class="ms-panel open-panel drawer-open-panel" x-show="drawerOpenMenu" x-transition.origin.top.left>
                  <template x-for="op in openers" :key="op.name">
                    <button class="ms-option ms-option-btn"
                            @click="openProject(drawer.path, op.name); drawerOpenMenu = false"
                            :disabled="opening[drawer.path + op.name]">
                      <span x-text="op.name"></span>
                    </button>
                  </template>
                  <div class="ms-panel-empty" x-show="openers.length === 0">未配置 opener</div>
                </div>
              </div>
              <button class="btn btn-ghost" disabled title="待后端 pull API">Pull</button>
              <button class="btn btn-ghost" @click="copyPath(drawer.path)">复制路径</button>
            </div>
          </section>

          <section class="drawer-section drawer-placeholder">
            <div class="drawer-label">worktree</div>
            <div class="placeholder-text">后端 worktree 能力未实现</div>
          </section>
        </div>
      </template>
    </aside>

  </main>
</div>
</body>
</html>
